<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121822"/>
      <stop offset="100%" stop-color="#0B0E11"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD535"/>
      <stop offset="100%" stop-color="#F0B90B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#F0B90B" stroke-width="2.5" stroke-opacity="0.8"/>
  
  <!-- Terminal Prompt '>_' -->
  <path d="M12 22 L20 28 L12 34" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="22" y1="34" x2="28" y2="34" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Candlestick 1 (Bullish green) -->
  <line x1="36" y1="16" x2="36" y2="44" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="33" y="22" width="6" height="16" rx="1.5" fill="url(#greenGrad)"/>

  <!-- Candlestick 2 (Gold Breakout) -->
  <line x1="48" y1="12" x2="48" y2="48" stroke="#F0B90B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="45" y="16" width="6" height="24" rx="1.5" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Bottom Pulse Signal Line -->
  <path d="M10 50 L24 50 L28 45 L32 54 L36 48 L40 52 L54 52" stroke="#F0B90B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
</svg>
